    <line x1="36" y1="28" x2="36" y2="44" />
    <line x1="1056" y1="36" x2="1072" y2="36" />
    <line x1="1064" y1="28" x2="1064" y2="44" />
    <line x1="28" y1="644" x2="44" y2="644" />
    <line x1="36" y1="636" x2="36" y2="652" />
    <line x1="1056" y1="644" x2="1072" y2="644" />
