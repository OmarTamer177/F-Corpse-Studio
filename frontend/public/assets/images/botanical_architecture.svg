    <path d="M550 534 Q545 440 555 380 Q560 340 550 310" fill="none" stroke="#1d4d33" stroke-width="3" />
    <circle cx="550" cy="300" r="28" fill="#1d4d33" opacity="0.85" />
    <circle cx="525" cy="315" r="22" fill="#265c3e" opacity="0.85" />
    <circle cx="580" cy="315" r="24" fill="#1d4d33" opacity="0.85" />
