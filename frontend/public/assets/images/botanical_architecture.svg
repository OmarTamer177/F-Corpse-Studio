    <path d="M325 375 C305 360 300 380 315 393 C325 400 335 385 325 375 Z" />
    <path d="M360 320 C380 305 385 325 370 338 C360 345 350 330 360 320 Z" />
    <path d="M335 270 C315 255 310 275 325 288 C335 295 345 280 335 270 Z" />
    <path d="M360 215 C380 200 385 220 370 233 C360 240 350 225 360 215 Z" />

