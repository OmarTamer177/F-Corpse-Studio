    <path d="M250 115 Q258 108 266 115 Q274 108 282 115" />
    <path d="M840 130 Q850 122 860 130 Q870 122 880 130" />
  </g>

  <!-- Inscription Plate at bottom -->
  <line x1="60" y1="590" x2="1040" y2="590" stroke="#161a17" stroke-width="1" />
  <text x="60" y="618" font-family="'Agency FB', sans-serif" font-size="15" letter-spacing="4" fill="#161a17" font-weight="bold">FCORPSE ATELIER — STUDY 01: MONOLITH AND FLORA</text>
  <text x="1040" y="618" text-anchor="end" font-family="'Agency FB', sans-serif" font-size="14" letter-spacing="3" fill="#1d4d33" font-weight="bold">DEBUT TITLE PROTOTYPE</text>
</svg>