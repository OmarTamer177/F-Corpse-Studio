name: studio

services:
  # ── PostgreSQL Database Service ──
  db:
    image: postgres:15-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-voltix_task}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-voltix_task}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  # ── Flask / Gunicorn Backend Service ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: studio-backend:latest
    container_name: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123456}@db:5432/${POSTGRES_DB:-voltix_task}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret-key-123-voltix-security-key}
      FLASK_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app_net

  # ── React + Nginx Frontend Service ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: studio-frontend:latest
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local

networks:
  app_net:
    driver: bridge
